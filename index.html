  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto;}
  .toast-ok{background:#1C799B;color:#fff;}
  .toast-erro{background:#c0392b;color:#fff;}

/*
  Estrutura esperada da tabela "correicoes" no Supabase:
  ─────────────────────────────────────────────────────
  id          uuid  (default: gen_random_uuid(), primary key)
  user_id     text  (email do usuário — vem do MSAL)
  nome        text
  dados       jsonb (campos do formulário por seção)
  secoes_ok   jsonb (ex: {"0":true,"2":true})
  finalizado  boolean (default: false)
  criado_em   timestamptz (default: now())
  atualizado_em timestamptz (default: now())

  SQL para criar:
  ───────────────
  create table correicoes (
    id            uuid primary key default gen_random_uuid(),
    user_id       text not null,
    nome          text,
    dados         jsonb default '{}'::jsonb,
    secoes_ok     jsonb default '{}'::jsonb,
    finalizado    boolean default false,
    criado_em     timestamptz default now(),
    atualizado_em timestamptz default now()
  );
  -- RLS: cada usuário só vê o seu
  alter table correicoes enable row level security;
  create policy "usuario_proprio" on correicoes
    using (user_id = current_setting('request.jwt.claims', true)::json->>'email');
*/

/* ================================================================
   ESTADO GLOBAL
   ================================================================ */
let atual        = 0;
let registroId   = null;   // UUID do registro ativo no Supabase
let modoLeitura  = false;  // true = formulário bloqueado (já finalizado)

/* ================================================================
   UTILITÁRIOS DE USUÁRIO
   ================================================================ */
function getEmailUsuario(){
  try{
    const acc = JSON.parse(localStorage.getItem('msalAccount') || '{}');
    return acc.username || acc.email || 'desconhecido';
  }catch(e){ return 'desconhecido'; }
}
function getNomeUsuario(){
  try{
    const acc = JSON.parse(localStorage.getItem('msalAccount') || '{}');
    return acc.name || acc.displayName || acc.nome || 'desconhecido';
  }catch(e){ return 'desconhecido'; }
}

function exibirBadgeUsuario(){
  const nome  = getNomeUsuario();
  const email = getEmailUsuario();
  const badge = document.getElementById('userBadge');
  const span  = document.getElementById('userName');
  const av    = document.getElementById('userAvatar');
  const iniciais = nome.split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase() || '?';
  av.textContent = iniciais;
  span.textContent = nome !== 'desconhecido' ? nome : email;
  badge.style.display = 'flex';
}

/* ================================================================
   LOADING OVERLAY
   ================================================================ */
function mostrarLoading(msg='Carregando…'){
  document.getElementById('loadingMsg').textContent = msg;
  document.getElementById('loadingOverlay').style.display = 'flex';
}
function esconderLoading(){
  document.getElementById('loadingOverlay').style.display = 'none';
}

/* ================================================================
   MENU
   ================================================================ */
function toggleMenu(){
  document.getElementById('menu').classList.toggle('open');
  document.getElementById('menuOverlay').classList.toggle('open');
  let mb = document.querySelector('.menu-btn');
  mb.style.display = mb.style.display === 'none' ? 'inline-block' : 'none';
}

function logout(){
  localStorage.removeItem('msalAccount');
  localStorage.removeItem('msal_email');
  Object.keys(localStorage).filter(k=>k.startsWith('msal.')).forEach(k=>localStorage.removeItem(k));
  window.location.replace('/login.html');
}

function criarMenu(){
  let m = document.getElementById('menu');
  m.innerHTML = '';
  let scroll = document.createElement('div');
  scroll.className = 'menu-scroll';
  m.appendChild(scroll);

  form.secoes.forEach((s,i)=>{
    let a = document.createElement('a');
    a.id = `menu-sec-${i}`;
    a.innerText = s.nome;
    a.onclick = ()=>{ abrirFormulario(); mostrar(i); toggleMenu(); };
    scroll.appendChild(a);
  });

  let sepNovo = document.createElement('a');
  sepNovo.innerText = '➕ Nova correição';
  sepNovo.style.cssText = 'margin-top:16px;border-top:1px solid rgba(255,255,255,0.18);padding-top:16px;color:#4FB8EE;';
  sepNovo.onclick = ()=>{ novaCorreicao(); toggleMenu(); };
  scroll.appendChild(sepNovo);

  let sepHistorico = document.createElement('a');
  sepHistorico.innerText = '📋 Histórico';

  scroll.appendChild(sepHistorico);

  logoutLink.onclick = logout;

/* ================================================================
   FORM — RENDERIZAÇÃO
   ================================================================ */
function criarForm(){
  let c = document.getElementById('formContainer');

  form.secoes.forEach((sec,i)=>{
    let d = document.createElement('div');
    d.className = 'section';
    if(i===0) d.classList.add('active');

    let h = document.createElement('h2');
    h.innerText = sec.nome;
    d.appendChild(h);

    if(sec.subtopicos){
      let chipBar = document.createElement('div');
      chipBar.className = 'chip-bar';
      let camposWrap = document.createElement('div');
      camposWrap.id = 'campos-especificos';
      let ativos = new Set();

      function atualizarCampos(){
        camposWrap.innerHTML = '';
        if(ativos.size===0){
          let aviso = document.createElement('p');
          aviso.className = 'chip-aviso';
          aviso.innerText = 'Selecione um ou mais tópicos acima para exibir os campos.';
          camposWrap.appendChild(aviso);
          return;
        }
        sec.subtopicos.forEach(sub=>{
          if(!ativos.has(sub.prefixo)) return;
          let gt = document.createElement('h3');
          gt.className = 'subtopico-title';
          gt.innerText = sub.nome;
          camposWrap.appendChild(gt);
          sec.campos.filter(c=>c.id.startsWith(sub.prefixo+'.')).forEach(campo=>render(camposWrap,campo));
        });
        carregar();
      }

      sec.subtopicos.forEach(sub=>{
        let chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.innerText = sub.nome;
        chip.dataset.prefixo = sub.prefixo;
        chip.onclick = ()=>{
          if(ativos.has(sub.prefixo)){ ativos.delete(sub.prefixo); chip.classList.remove('chip-ativo'); }
          else { ativos.add(sub.prefixo); chip.classList.add('chip-ativo'); }
          atualizarCampos();
        };
        chipBar.appendChild(chip);
      });
      d.appendChild(chipBar);
      atualizarCampos();
      d.appendChild(camposWrap);
    } else {
      sec.campos.forEach(campo=>render(d,campo));
    }

    let nav = document.createElement('div');
    nav.className = 'nav';
    if(i>0){ nav.appendChild(btn('Voltar','btn-gray',()=>mostrar(i-1))); }
    nav.appendChild(btn('Próximo','btn-primary',()=>mostrar(i+1)));
    nav.appendChild(btn('Salvar seção','btn-green',()=>salvarSecao(i)));
    d.appendChild(nav);
    c.appendChild(d);
  });

  atualizarBarra();
}

function render(p,c){
  let wrapper = document.createElement('div');
  wrapper.dataset.campoId = c.id;
  if(c.dependeDe){
    wrapper.dataset.dependeDeId    = c.dependeDe.id;
    wrapper.dataset.dependeDeValor = c.dependeDe.valor;
  }
  p.appendChild(wrapper);
  p = wrapper;

  let l = document.createElement('label');
  l.className = 'required';
  l.innerText = c.pergunta;
  p.appendChild(l);

  if(c.tipo==='textarea'){
    let t=document.createElement('textarea');
    t.id=c.id; t.required=true; t.oninput=autoSalvar;
    p.appendChild(t);
  }
  if(c.tipo==='date'){
    let i=document.createElement('input');
    i.type='date'; i.id=c.id; i.required=true; i.onchange=autoSalvar;
    p.appendChild(i);
  }
  if(c.tipo==='time'){
    let i=document.createElement('input');
    i.type='time'; i.id=c.id; i.required=true; i.onchange=autoSalvar;
    p.appendChild(i);
  }
  if(c.tipo==='number'){
    let i=document.createElement('input');
    i.type='number'; i.id=c.id; i.required=true; i.oninput=autoSalvar;
    p.appendChild(i);
  }
  if(c.tipo==='text'){
    let i=document.createElement('input');
    i.type='text'; i.id=c.id; i.required=true; i.oninput=autoSalvar;
    p.appendChild(i);
  }
  if(c.tipo==='radio'){
    let dv=document.createElement('div');
    dv.className='radio-group';
    c.opcoes.forEach(op=>{
      let lbl=document.createElement('label');
      let r=document.createElement('input');
      r.type='radio'; r.name=c.id; r.value=op; r.required=true;
      r.onchange=()=>{ avaliarCondicionais(); autoSalvar(); };
      lbl.appendChild(r);
      lbl.append(' '+op);
      dv.appendChild(lbl);
    });
    p.appendChild(dv);
  }
}

/* ================================================================
   CONDICIONAIS
   ================================================================ */
function avaliarCondicionais(){
  document.querySelectorAll('[data-depende-de-id]').forEach(wrapper=>{
    let controlId     = wrapper.dataset.dependeDeId;
    let valorEsperado = wrapper.dataset.dependeDeValor;
    let controlEl     = document.querySelector(`input[name="${controlId}"]:checked`);
    let valorAtual    = controlEl ? controlEl.value : null;
    let obrigatorio   = (valorAtual === valorEsperado);
    wrapper.querySelectorAll('input, textarea, select').forEach(el=>{ el.required = obrigatorio; });
    let lbl = wrapper.querySelector('label');
    if(lbl) lbl.className = obrigatorio ? 'required' : '';
  });
}

/* ================================================================
   BOTÃO UTILITÁRIO
   ================================================================ */
function btn(text,cls,fn){
  let b=document.createElement('button');
  b.innerText=text; b.className=cls; b.onclick=fn;
  return b;
}

/* ================================================================
   NAVEGAÇÃO / PROGRESSO
   ================================================================ */
function mostrar(i){
  let secs=document.querySelectorAll('.section');
  if(i<0||i>=secs.length) return;
  secs.forEach(s=>s.classList.remove('active'));
  secs[i].classList.add('active');
  atual=i;
  atualizarBarra();
}

function atualizarBarra(){
  let perc=((atual+1)/form.secoes.length)*100;
  document.getElementById('progressBar').style.width=perc+'%';
}

/* ================================================================
   COLETA DE DADOS DO DOM
   ================================================================ */
function coletar(sec=null){
  let base = sec!==null ? document.querySelectorAll('.section')[sec] : document;
  let inputs = base.querySelectorAll('input,textarea');
  let d={};
  inputs.forEach(i=>{
    if(i.type==='radio'){ if(i.checked) d[i.name]=String(i.value); }
    else { if(i.id) d[i.id]=String(i.value); }
  });
  return d;
}

function carregar(){
  // Lê dados salvos no Supabase (já em memória) ou do localStorage fallback
  let dadosSalvos = window._dadosCarregados || {};
  Object.keys(dadosSalvos).forEach(k=>{
    let el=document.getElementById(k)||document.querySelector(`input[name="${k}"][value="${dadosSalvos[k]}"]`);
    if(!el) return;
    if(el.type==='radio'){
      let r=document.querySelector(`input[name="${k}"][value="${dadosSalvos[k]}"]`);
      if(r) r.checked=true;
    } else {
      el.value=dadosSalvos[k];
    }
  });
  avaliarCondicionais();
}

/* ================================================================
   VALIDAÇÃO
   ================================================================ */
function limparInvalidos(base){
  base.querySelectorAll('.invalid').forEach(el=>el.classList.remove('invalid'));
}
function encontrarInvalidos(base){
  limparInvalidos(base);
  let invalids=[]; let radiosProc=new Set();
  base.querySelectorAll('input,textarea').forEach(el=>{
    if(el.type==='radio'){
      if(radiosProc.has(el.name)) return;
      radiosProc.add(el.name);
      let radios=Array.from(base.querySelectorAll(`input[name="${el.name}"]`));
      if(el.required && !radios.some(r=>r.checked)){
        let grupo=radios[0]&&radios[0].closest('.radio-group');
        if(grupo){ grupo.classList.add('invalid'); invalids.push(grupo); }
        else { radios[0].classList.add('invalid'); invalids.push(radios[0]); }
      }
      return;
    }
    if(el.required && (!el.value||!el.value.toString().trim())){
      el.classList.add('invalid'); invalids.push(el);
    }
  });
  return invalids;
}
function focusFirstInvalid(invalids){
  if(!invalids.length) return;
  let first=invalids[0];
  if(first.classList.contains('radio-group')){
    let r=first.querySelector('input[type="radio"]');
    if(r) r.focus();
  } else { first.focus(); }
  first.scrollIntoView({behavior:'smooth',block:'center'});
}

/* ================================================================
   SUPABASE — CRUD
   ================================================================ */

// Garante que existe um registro em aberto para o usuário.
// Retorna o registro (row).
async function garantirRegistroAberto(){
  const userId = getEmailUsuario();

  // Busca registro não finalizado do usuário
  let { data, error } = await sb
    .from('correicoes')
    .select('*')
    .eq('user_id', userId)
    .eq('finalizado', false)
    .order('criado_em', { ascending: false })
    .limit(1);

  if(error) throw error;

  if(data && data.length > 0){
    return data[0];
  }

  // Nenhum aberto — cria um novo
  let { data: novo, error: errNovo } = await sb
    .from('correicoes')
    .insert({ user_id: userId, nome: getNomeUsuario(), dados: {}, secoes_ok: {}, finalizado: false })
    .select()
    .single();

  if(errNovo) throw errNovo;
  return novo;
}

// Auto-salva campo a campo (debounce 1.5s)
let _autoSalvarTimer = null;
function autoSalvar(){
  clearTimeout(_autoSalvarTimer);
  _autoSalvarTimer = setTimeout(()=>{ persistirDados(); }, 1500);
}

// Persiste todos os dados do formulário no Supabase
async function persistirDados(){
  if(!registroId) return;
  const dados = coletar();
  window._dadosCarregados = dados;
  await sb.from('correicoes').update({
    dados,
    atualizado_em: new Date().toISOString()
  }).eq('id', registroId);
}

/* ================================================================
   SALVAR SEÇÃO (antigo "Enviar seção")
   ================================================================ */
async function salvarSecao(i){
  if(modoLeitura){ showToast('Este envio já foi finalizado e não pode ser alterado.','erro'); return; }

  let section = document.querySelectorAll('.section')[i];
  let invalidos = encontrarInvalidos(section);
  if(invalidos.length){
    mostrar(i);
    focusFirstInvalid(invalidos);
    showToast('Preencha todos os campos obrigatórios antes de salvar a seção.','erro');
    return;
  }

  mostrarLoading('Salvando seção…');
  try{
    const dadosSecao  = coletar(i);
    const dadosAtuais = window._dadosCarregados || {};
    const dadosMerged = Object.assign({}, dadosAtuais, dadosSecao);
    window._dadosCarregados = dadosMerged;

    // Busca secoes_ok atual
    let { data: reg } = await sb.from('correicoes').select('secoes_ok').eq('id', registroId).single();
    let secoesOk = reg ? (reg.secoes_ok || {}) : {};
    secoesOk[i] = "true";

    await sb.from('correicoes').update({
      dados: dadosMerged,
      secoes_ok: secoesOk,
      atualizado_em: new Date().toISOString()
    }).eq('id', registroId);

    bloquearSecao(i);
    atualizarMenuBadge(i);
    showToast(`Seção "${form.secoes[i].nome}" salva ✅`,'ok');
  }catch(err){
    console.error(err);
    showToast('Erro ao salvar seção. Verifique sua conexão.','erro');
  }finally{
    esconderLoading();
  }
}

/* ================================================================

const PA_CRIAR = "https://default84a9248e396f44df84a94379e11007.ab.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/679dbd3be9884fac8665fa7b7458c589/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=MyA3qI1BWcZTqtVbRNPmJx3vUVW0RKkXNFrOkd5vH6A";

async function enviarTudo(){
  if(modoLeitura){ showToast('Este envio já foi finalizado.','erro'); return; }

  let container = document.getElementById('formContainer');
  let invalidos = encontrarInvalidos(container);
  if(invalidos.length){
    let firstSection = invalidos[0].closest('.section');
    if(firstSection){ mostrar(Array.from(document.querySelectorAll('.section')).indexOf(firstSection)); }
    focusFirstInvalid(invalidos);
    showToast('Preencha todos os campos obrigatórios antes de enviar.','erro');
    return;
  }

  mostrarLoading('Enviando…');
  try{
    const dadosCampos = coletar();
    const email       = getEmailUsuario();
    const nome        = getNomeUsuario();
    const dataEnvio   = new Date().toISOString();

    // 1. Finaliza no Supabase PRIMEIRO (garante que o PA vai encontrar os dados)
    await sb.from('correicoes').update({
      dados: dadosCampos,
      finalizado: true,
      atualizado_em: dataEnvio
    }).eq('id', registroId);

    // 2. Envia payload REDUZIDO ao Power Automate
    //    O PA busca os dados completos no Supabase pelo registro_id
    const payload = {
      registro_id: registroId,
      email:       email,
      nome:        nome,
      data_envio:  dataEnvio
    };

    console.log('%c[enviarTudo] Payload enviado ao Power Automate','color:#1C799B;font-weight:bold;font-size:13px');
    console.log(payload);

    const r = await fetch(PA_CRIAR, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!r.ok) throw new Error('HTTP '+r.status);

    // 3. Bloqueia tudo
    modoLeitura = true;
    form.secoes.forEach((_,i)=>bloquearSecao(i));
    document.getElementById('enviarTudoWrap').style.display = 'none';
    mostrarAvisoLeitura();

    showToast('Dados enviados com sucesso ✅','ok');
  }catch(err){
    console.error('Erro enviarTudo:',err);
    showToast('Erro ao enviar ('+( err.message||'verifique o console')+'). Tente novamente.','erro');
  }finally{
    esconderLoading();
  }
}

/* ================================================================
   NOVA CORREIÇÃO
   ================================================================ */
async function novaCorreicao(){
  // Verifica se há seções pendentes no registro atual
  if(registroId && !modoLeitura){
    let { data: reg } = await sb.from('correicoes').select('secoes_ok').eq('id', registroId).single();
    let secoesOk = reg ? (reg.secoes_ok || {}) : {};
    let qtdEnviadas = Object.keys(secoesOk).length;
    let qtdTotal    = form.secoes.length;
    if(qtdEnviadas < qtdTotal){
      let pendentes = qtdTotal - qtdEnviadas;
      if(!confirm(`Você tem ${pendentes} seção(ões) não salva(s) no registro atual.\n\nDeseja realmente iniciar uma nova correição? O rascunho atual será mantido.`)) return;
    }
  }

  mostrarLoading('Criando nova correição…');
  try{
    const userId = getEmailUsuario();
    let { data: novo, error } = await sb
      .from('correicoes')
      .insert({ user_id: userId, nome: getNomeUsuario(), dados: {}, secoes_ok: {}, finalizado: false })
      .select()
      .single();
    if(error) throw error;

    registroId = novo.id;
    modoLeitura = false;
    window._dadosCarregados = {};

    // Limpa o formulário
    document.querySelectorAll('#formContainer input, #formContainer textarea').forEach(el=>{
      if(el.type==='radio'||el.type==='checkbox') el.checked=false;
      else el.value='';
    });
    // Remove bloqueios e badges
    form.secoes.forEach((_,i)=>{ desbloquearSecao(i); atualizarMenuBadge(i, false); });
    document.getElementById('enviarTudoWrap').style.display='';
    document.querySelector('.modo-leitura-aviso') && document.querySelector('.modo-leitura-aviso').remove();
    avaliarCondicionais();
    abrirFormulario();
    mostrar(0);

    showToast('Nova correição iniciada ✅','ok');
  }catch(err){
    console.error(err);
    showToast('Erro ao criar nova correição.','erro');
  }finally{
    esconderLoading();
  }
}

/* ================================================================
   HISTÓRICO
   ================================================================ */
function abrirFormulario(){
  document.getElementById('formContainer').style.display='';
  document.getElementById('historicoContainer').style.display='none';
  if(!modoLeitura) document.getElementById('enviarTudoWrap').style.display='';
}

async function abrirHistorico(){
  document.getElementById('formContainer').style.display='none';
  document.getElementById('enviarTudoWrap').style.display='none';
  let hc = document.getElementById('historicoContainer');
  hc.style.display='';
  hc.innerHTML='<p style="color:#546E7A;padding:20px">Carregando histórico…</p>';

  try{
    let { data, error } = await sb
      .from('correicoes')
      .select('id, criado_em, atualizado_em, finalizado, secoes_ok')
      .eq('user_id', getEmailUsuario())
      .order('criado_em', { ascending: false });

    if(error) throw error;
    renderHistorico(data || [], hc);
  }catch(err){
    hc.innerHTML='<p style="color:#c0392b;padding:20px">Erro ao carregar histórico.</p>';
    console.error(err);
  }
}

function renderHistorico(registros, container){
  container.innerHTML='';
  let titulo=document.createElement('h2');
  titulo.innerText='📋 Histórico de Correições';
  titulo.style.cssText='color:#1C799B;margin-bottom:20px;';
  container.appendChild(titulo);

  if(!registros||registros.length===0){
    container.innerHTML+='<p style="color:#546E7A">Nenhum registro encontrado.</p>';
    return;
  }

  registros.forEach(reg=>{
    let card=document.createElement('div');
    card.style.cssText=`
      background:#fff;border-radius:10px;padding:18px 20px;margin-bottom:14px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
      border-left:4px solid ${reg.finalizado ? '#27ae60' : '#1C799B'};
      display:flex;justify-content:space-between;align-items:flex-start;
      gap:18px;
    `;
    let data = new Date(reg.criado_em);
    let dataStr = isNaN(data) ? reg.criado_em : data.toLocaleString('pt-BR');
    let secoesOk = Object.keys(reg.secoes_ok||{}).length;
    let status = reg.finalizado
      ? '<span style="color:#27ae60;font-weight:700">✅ Finalizado</span>'
      : `<span style="color:#f39c12;font-weight:700">⏳ Em andamento (${secoesOk}/${form.secoes.length} seções)</span>`;

    card.innerHTML=`
      <div>
        <div style="font-weight:700;color:#263238;font-size:15px">Correição — ${dataStr}</div>
        <div style="color:#546E7A;font-size:13px;margin-top:4px">${status}</div>
      </div>
      
<div class="historico-card-actions">
  <button class="btn-primary">Abrir</button>
  <button class="btn-gray">📄 PDF</button>
  <button class="btn-danger">🗑️ Excluir</button>
</div>
    `;

let btnAbrir   = card.querySelector('.btn-primary');
let btnPDF     = card.querySelector('.btn-gray');
let btnExcluir = card.querySelector('.btn-danger');

// ABRIR
btnAbrir.onclick = () => carregarRegistro(reg.id, reg.finalizado);

// PDF
btnPDF.onclick = () => baixarPDF(reg);

// EXCLUIR
if(reg.finalizado){
  btnExcluir.disabled = true;
  btnExcluir.style.opacity = '0.5';
  btnExcluir.style.cursor = 'not-allowed';
  btnExcluir.title = 'Registros finalizados não podem ser excluídos';
}else{
  btnExcluir.onclick = () => excluirRegistro(reg.id);
}

container.appendChild(card);
  });
}

async function carregarRegistro(id, finalizado){
  mostrarLoading('Carregando registro…');
  try{
    let { data: reg, error } = await sb.from('correicoes').select('*').eq('id', id).single();
    if(error) throw error;

    registroId  = reg.id;
    modoLeitura = reg.finalizado;
    window._dadosCarregados = reg.dados || {};

    // Limpa campos antes de carregar
    document.querySelectorAll('#formContainer input, #formContainer textarea').forEach(el=>{
      if(el.type==='radio'||el.type==='checkbox') el.checked=false;
      else el.value='';
    });
    // Remove bloqueios antigos
    form.secoes.forEach((_,i)=>{ desbloquearSecao(i); atualizarMenuBadge(i, false); });

    carregar();

    // Restaura bloqueios de seções salvas
    let secoesOk = reg.secoes_ok || {};
    Object.keys(secoesOk).forEach(i=>{ bloquearSecao(Number(i)); atualizarMenuBadge(Number(i), true); });

    if(modoLeitura){
      form.secoes.forEach((_,i)=>bloquearSecao(i));
      document.getElementById('enviarTudoWrap').style.display='none';
      mostrarAvisoLeitura();
    } else {
      document.getElementById('enviarTudoWrap').style.display='';
      document.querySelector('.modo-leitura-aviso')&&document.querySelector('.modo-leitura-aviso').remove();
    }

    abrirFormulario();
    mostrar(0);
    avaliarCondicionais();
  }catch(err){
    console.error(err);
    showToast('Erro ao carregar registro.','erro');
  }finally{
    esconderLoading();
  }
}
async function excluirRegistro(id){
  const confirmar = confirm(
    'Deseja realmente excluir esta correição?\n\nEsta ação não poderá ser desfeita.'
  );

  if(!confirmar) return;

  mostrarLoading('Excluindo registro…');

  try{

    // Segurança extra:
    // só exclui se NÃO estiver finalizado
    const { data: reg, error: erroBusca } = await sb
      .from('correicoes')
      .select('id, finalizado')
      .eq('id', id)
      .single();

    if(erroBusca) throw erroBusca;

    if(reg.finalizado){
      showToast('Registros finalizados não podem ser excluídos.','erro');
      return;
    }

    // Exclui no banco
    const { error: erroDelete } = await sb
      .from('correicoes')
      .delete()
      .eq('id', id);

    if(erroDelete) throw erroDelete;

    showToast('Registro excluído com sucesso ✅','ok');

    // Atualiza o histórico
    abrirHistorico();

  }catch(err){
    console.error(err);
    showToast('Erro ao excluir registro.','erro');
  }finally{
    esconderLoading();
  }
}

/* ================================================================
   BLOQUEIO / DESBLOQUEIO
   ================================================================ */
function bloquearSecao(i){
  let section=document.querySelectorAll('.section')[i];
  if(!section) return;
  section.querySelectorAll('input, textarea, select').forEach(el=>el.disabled=true);
  if(!section.querySelector('.btn-editar') && !modoLeitura){
    let btnE=document.createElement('button');
    btnE.innerText='✏️ Editar esta seção';
    btnE.className='btn-editar btn-gray';
    btnE.style.marginTop='16px';
    btnE.onclick=()=>desbloquearSecao(i,btnE);
    let nav=section.querySelector('.nav');
    if(nav) nav.prepend(btnE);
  }
}

function desbloquearSecao(i, btnEditar){
  let section=document.querySelectorAll('.section')[i];
  if(!section) return;
  section.querySelectorAll('input, textarea, select').forEach(el=>el.disabled=false);
  if(btnEditar) btnEditar.remove();
}

function atualizarMenuBadge(i, enviada=true){
  let link=document.getElementById(`menu-sec-${i}`);
  if(!link) return;
  let badge=link.querySelector('.badge-enviada');
  if(enviada && !badge){
    let b=document.createElement('span');
    b.className='badge-enviada';
    b.textContent='✓';
    link.appendChild(b);
  } else if(!enviada && badge){
    badge.remove();
  }
}

function mostrarAvisoLeitura(){
  if(document.querySelector('.modo-leitura-aviso')) return;
  let aviso=document.createElement('div');
  aviso.className='modo-leitura-aviso';
  aviso.innerHTML='🔒 <b>Correição finalizada.</b> Este registro está em modo somente leitura. Use "➕ Nova correição" no menu para iniciar um novo.';
  let fc=document.getElementById('formContainer');
  fc.prepend(aviso);
}

/* ================================================================
   TOAST
   ================================================================ */
function showToast(msg,tipo){
  let t=document.getElementById('toast');
  if(!t) return;
  t.textContent=msg;
  t.className='toast '+(tipo==='erro'?'toast-erro':'toast-ok');
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),4000);
}

/* ================================================================
   UTILITÁRIOS HTML
   ================================================================ */
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ================================================================
   INICIALIZAÇÃO
   ================================================================ */
async function init(){
  mostrarLoading('Carregando…');
  try{
    exibirBadgeUsuario();
    criarMenu();
    criarForm();

    // Busca ou cria registro em aberto
    let reg = await garantirRegistroAberto();
    registroId  = reg.id;
    modoLeitura = reg.finalizado;
    window._dadosCarregados = reg.dados || {};

    carregar();

    // Restaura bloqueios das seções já salvas
    let secoesOk = reg.secoes_ok || {};
    Object.keys(secoesOk).forEach(i=>{ bloquearSecao(Number(i)); atualizarMenuBadge(Number(i), true); });

    if(modoLeitura){
      form.secoes.forEach((_,i)=>bloquearSecao(i));
      document.getElementById('enviarTudoWrap').style.display='none';
      mostrarAvisoLeitura();
    }

    avaliarCondicionais();
    mostrar(0);
  }catch(err){
    console.error('Erro na inicialização:',err);
    showToast('Erro ao conectar ao banco de dados. Verifique as credenciais do Supabase.','erro');
  }finally{
    esconderLoading();
  }
}

init();
</script>
