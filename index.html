<style>
  /* ── Chips de subtópico ── */
  .chip-bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px;}
  .chip{
    padding:7px 14px;border-radius:20px;border:2px solid var(--accent,#1C799B);
    background:#fff;color:var(--accent,#1C799B);font-size:13px;font-weight:600;
    cursor:pointer;transition:all .18s;white-space:nowrap;
  }

  .chip-aviso{color:#888;font-style:italic;margin:12px 0;}
  .subtopico-title{
    font-size:15px;font-weight:700;color:var(--accent,#1C799B);
    margin:24px 0 10px;padding-bottom:6px;
    border-bottom:2px solid var(--accent,#1C799B);

  /* ── Toast ── */

    transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s;

  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto;}

<script>

let atual = 0;

/* ===== MENU ===== */
function toggleMenu(){
  document.getElementById("menu").classList.toggle("open");
  document.getElementById("menuOverlay").classList.toggle("open");
  document.querySelector(".menu-btn").style.display = 
    document.querySelector(".menu-btn").style.display === "none" ? "inline-block" : "none";
}

function logout(){
  localStorage.removeItem('msalAccount');
  localStorage.removeItem('msal_email');
  Object.keys(localStorage)
    .filter(k => k.startsWith('msal.'))
    .forEach(k => localStorage.removeItem(k));
  window.location.replace('/login.html');
}

function criarMenu(){
 
let m = document.getElementById("menu");
m.innerHTML = ""; // limpa

let scroll = document.createElement("div");
scroll.className = "menu-scroll";

m.appendChild(scroll);

  form.secoes.forEach((s,i)=>{
    let a=document.createElement("a");
    a.innerText=s.nome;
    a.onclick=()=>{ abrirFormulario(); mostrar(i); toggleMenu(); };
    scroll.appendChild(a);
  });

  let sepHistorico = document.createElement("a");
  sepHistorico.innerText = "📋 Histórico";
  sepHistorico.style.marginTop = "16px";
  sepHistorico.style.borderTop = "1px solid rgba(255,255,255,0.18)";
  sepHistorico.style.paddingTop = "16px";
  sepHistorico.style.color = "#4FB8EE";
  sepHistorico.onclick = () => { abrirHistorico(); toggleMenu(); };
  scroll.appendChild(sepHistorico);

  let logoutLink = document.createElement("a");
  logoutLink.innerText = "Sair";
  logoutLink.style.marginTop = "8px";
  logoutLink.style.borderTop = "1px solid rgba(255,255,255,0.18)";
  logoutLink.style.paddingTop = "16px";
  logoutLink.onclick = logout;
  scroll.appendChild(logoutLink);
}

/* ===== FORM ===== */
function criarForm(){
  let c = document.getElementById("formContainer");

  form.secoes.forEach((sec,i)=>{
    let d=document.createElement("div");
    d.className="section";
    if(i===0) d.classList.add("active");

    let h=document.createElement("h2");
    h.innerText=sec.nome;
    d.appendChild(h);

    // ── Seção com subtópicos: renderiza chips de filtro múltiplo ──
    if(sec.subtopicos){
      // barra de chips
      let chipBar=document.createElement("div");
      chipBar.className="chip-bar";

      // container dos campos filtrados
      let camposWrap=document.createElement("div");
      camposWrap.id="campos-especificos";

      let ativos=new Set(); // prefixos selecionados

      function atualizarCampos(){
        camposWrap.innerHTML="";
        if(ativos.size===0){
          let aviso=document.createElement("p");
          aviso.className="chip-aviso";
          aviso.innerText="Selecione um ou mais tópicos acima para exibir os campos.";
          camposWrap.appendChild(aviso);
          return;
        }
        sec.subtopicos.forEach(sub=>{
          if(!ativos.has(sub.prefixo)) return;
          // título do grupo
          let gt=document.createElement("h3");
          gt.className="subtopico-title";
          gt.innerText=sub.nome;
          camposWrap.appendChild(gt);
          // campos do grupo
          sec.campos
            .filter(c=>c.id.startsWith(sub.prefixo+"."))
            .forEach(campo=>render(camposWrap,campo));
        });
        // restaurar valores salvos
        carregar();
      }

      sec.subtopicos.forEach(sub=>{
        let chip=document.createElement("button");
        chip.type="button";
        chip.className="chip";
        chip.innerText=sub.nome;
        chip.dataset.prefixo=sub.prefixo;
        chip.onclick=()=>{
          if(ativos.has(sub.prefixo)){
            ativos.delete(sub.prefixo);
            chip.classList.remove("chip-ativo");
          } else {
            ativos.add(sub.prefixo);
            chip.classList.add("chip-ativo");
          }
          atualizarCampos();
        };
        chipBar.appendChild(chip);
      });

      d.appendChild(chipBar);
      atualizarCampos();
      d.appendChild(camposWrap);

    } else {
      sec.campos.forEach(campo=>render(d,campo));
    }

    let nav=document.createElement("div");
    nav.className="nav";

    if(i>0){
      let b1=btn("Voltar","btn-gray",()=>mostrar(i-1));
      nav.appendChild(b1);
    }

    let b2=btn("Próximo","btn-primary",()=>mostrar(i+1));
    nav.appendChild(b2);

    let b3=btn("Enviar seção","btn-green",()=>enviarSecao(i));
    nav.appendChild(b3);

    d.appendChild(nav);

    c.appendChild(d);
  });

  atualizarBarra();
}
function render(p,c){

  let l=document.createElement("label");
  l.className = "required";
  l.innerText=c.pergunta;
  p.appendChild(l);

  // TEXTAREA
  if(c.tipo==="textarea"){
    let t=document.createElement("textarea");
    t.id=c.id;
    t.required=true;
    t.oninput=salvar;
    p.appendChild(t);
  }

  // DATE
  if(c.tipo==="date"){
    let i=document.createElement("input");
    i.type="date";
    i.id=c.id;
    i.required=true;
    i.onchange=salvar;
    p.appendChild(i);
  }

  // TIME ✅ NOVO
  if(c.tipo==="time"){
    let i=document.createElement("input");
    i.type="time";
    i.id=c.id;
    i.required=true;
    i.onchange=salvar;
    p.appendChild(i);
  }

  // NUMBER ✅ NOVO
  if(c.tipo==="number"){
    
    let i=document.createElement("input");
    i.type="number";
    i.id=c.id;
    i.required=true;
    i.oninput=salvar;
    p.appendChild(i);
  }

  // TEXT ✅ NOVO
  if(c.tipo==="text"){
    let i=document.createElement("input");
    i.type="text";
    i.id=c.id;
    i.required=true;
    i.oninput=salvar;
    p.appendChild(i);
  }

  // RADIO
  if(c.tipo==="radio"){
    let d=document.createElement("div");
    d.className="radio-group";

    c.opcoes.forEach(op=>{
      let lbl=document.createElement("label");
      let r=document.createElement("input");

      r.type="radio";
      r.name=c.id;
      r.value=op;
      r.required=true;
      r.onchange=salvar;

      lbl.appendChild(r);
      lbl.append(" "+op);
      d.appendChild(lbl);
    });

    p.appendChild(d);
  }
}

/* ===== BOTÃO ===== */
function btn(text,cls,fn){
  let b=document.createElement("button");
  b.innerText=text;
  b.className=cls;
  b.onclick=fn;
  return b;
}

/* ===== NAVEGAÇÃO ===== */
function mostrar(i){
  let secs=document.querySelectorAll(".section");
  if(i<0||i>=secs.length) return;

  secs.forEach(s=>s.classList.remove("active"));
  secs[i].classList.add("active");

  atual=i;
  atualizarBarra();
}

/* ===== PROGRESSO ===== */
function atualizarBarra(){
  let perc = ((atual+1)/form.secoes.length)*100;
  document.getElementById("progressBar").style.width = perc+"%";
}

/* ===== STORAGE ===== */
function salvar(){
  let dados = coletar();
  localStorage.setItem("form_correcao", JSON.stringify(dados));
}

function carregar(){
  let dados = JSON.parse(localStorage.getItem("form_correcao")||"{}");

  Object.keys(dados).forEach(k=>{
    let el=document.getElementById(k) || document.querySelector(`input[name="${k}"][value="${dados[k]}"]`);
    if(el){
      if(el.type==="radio"){
        document.querySelector(`input[name="${k}"][value="${dados[k]}"]`).checked=true;
      }else{
        el.value=dados[k];
      }
    }
  });
}

/* ===== COLETA ===== */
function coletar(sec=null){
  let base = sec!==null ? document.querySelectorAll(".section")[sec] : document;
  let inputs = base.querySelectorAll("input,textarea");

  let d={};

  inputs.forEach(i=>{
    if(i.type==="radio"){
      if(i.checked) d[i.name]=i.value;
    } else {
      d[i.id]=i.value;
    }
  });

  return d;
}

/* ===== VALIDAÇÃO ===== */
function limparInvalidos(base){
  base.querySelectorAll('.invalid').forEach(el=>el.classList.remove('invalid'));
}

function encontrarInvalidos(base){
  limparInvalidos(base);
  let invalids = [];
  let radiosProcessados = new Set();

  base.querySelectorAll('input,textarea').forEach(el=>{
    if(el.type === 'radio'){
      if(radiosProcessados.has(el.name)) return;
      radiosProcessados.add(el.name);
      let radios = Array.from(base.querySelectorAll(`input[name="${el.name}"]`));
      if(!radios.some(r=>r.checked)){
        let grupo = radios[0] && radios[0].closest('.radio-group');
        if(grupo){
          grupo.classList.add('invalid');
          invalids.push(grupo);
        } else {
          radios[0].classList.add('invalid');
          invalids.push(radios[0]);
        }
      }
      return;
    }

    if(el.required){
      if(!el.value || !el.value.toString().trim()){
        el.classList.add('invalid');
        invalids.push(el);
      }
    }
  });

  return invalids;
}

function focusFirstInvalid(invalids){
  if(!invalids.length) return;
  let first = invalids[0];
  if(first.classList.contains('radio-group')){
    let firstRadio = first.querySelector('input[type="radio"]');
    if(firstRadio) firstRadio.focus();
  } else {
    first.focus();
  }
  first.scrollIntoView({ behavior:'smooth', block:'center' });
}

/* ===== ENVIO ===== */

// ─── Power Automate ────────────────────────────────────────────
const PA_CRIAR = "https://default84a9248e396f44df84a94379e11007.ab.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/679dbd3be9884fac8665fa7b7458c589/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=MyA3qI1BWcZTqtVbRNPmJx3vUVW0RKkXNFrOkd5vH6A";
// ───────────────────────────────────────────────────────────────

function getEmailUsuario(){
  try {
    const acc = JSON.parse(localStorage.getItem('msalAccount') || '{}');
    return acc.username || acc.email || 'desconhecido';
  } catch(e){ return 'desconhecido'; }
}
function getNomeUsuario(){
  try {
    const acc = JSON.parse(localStorage.getItem('msalAccount') || '{}');
    return acc.name || acc.displayName || acc.nome || 'desconhecido';
  } catch(e){ return 'desconhecido'; }
}
function enviarSecao(i){
  
alert(`⚠️ Os dados das seções ficam salvos apenas neste dispositivo.

Eles podem ser apagados se você:
• Limpar dados do navegador
• Trocar de dispositivo ou navegador
• Usar modo anônimo

Finalize em "Enviar tudo" para garantir o envio.`);

  let section = document.querySelectorAll('.section')[i];

  let invalidos = encontrarInvalidos(section);
  if(invalidos.length){
    mostrar(i);
    focusFirstInvalid(invalidos);
    alert('Preencha todos os campos obrigatórios antes de enviar a seção.');
    return;
  }

  let dadosSecao = coletar(i);

  // ✅ salva local
  let dados = JSON.parse(localStorage.getItem("form_correcao") || "{}");
  Object.assign(dados, dadosSecao);
  localStorage.setItem("form_correcao", JSON.stringify(dados));

  // ✅ marca seção como enviada
  let enviadas = JSON.parse(localStorage.getItem('secoes_enviadas') || '{}');
  enviadas[i] = true;
  localStorage.setItem('secoes_enviadas', JSON.stringify(enviadas));

  alert(`Seção "${form.secoes[i].nome}" salva localmente ✅`);

  bloquearSecao(i);
}

function enviarTudo(){
  let container = document.getElementById('formContainer');

  let invalidos = encontrarInvalidos(container);
  if(invalidos.length){
    let firstSection = invalidos[0].closest('.section');
    if(firstSection){
      let sections = Array.from(document.querySelectorAll('.section'));
      mostrar(sections.indexOf(firstSection));
    }
    focusFirstInvalid(invalidos);
    showToast('Preencha todos os campos obrigatórios antes de enviar.', 'erro');
    return;
  }

  // Monta payload: campos no nível raiz + metadados
  let dadosCampos = coletar();
  let email = getEmailUsuario();
  let nome = getNomeUsuario();
  let payload = Object.assign({}, dadosCampos, {
    __email: email,
    __nome: nome,
    __data_envio: new Date().toISOString()
  });

  // ── DEBUG: inspecione o JSON no F12 → Console ──
  console.log('%c[enviarTudo] JSON enviado ao Power Automate', 'color:#1C799B;font-weight:bold;font-size:13px');
  console.log(JSON.parse(JSON.stringify(payload))); // objeto expansível
  console.log('%c[enviarTudo] JSON stringificado:', 'color:#546E7A;font-size:12px', JSON.stringify(payload, null, 2));

  // Feedback visual
  let btnEnviar = document.querySelector('#enviarTudoWrap .btn-primary');
  let textoOriginal = btnEnviar ? btnEnviar.innerText : '';
  if(btnEnviar){ btnEnviar.disabled = true; btnEnviar.innerText = 'Enviando…'; }

  fetch(PA_CRIAR, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(r => {
    // PA pode retornar 200/202 com corpo vazio — trata ambos os casos
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.text().then(t => { try{ return JSON.parse(t); } catch(e){ return {}; } });
  })
  .then(() => {
    showToast('Dados enviados com sucesso ✅', 'ok');
    localStorage.removeItem("form_correcao");
    localStorage.removeItem("secoes_enviadas");
    localStorage.removeItem("registro_id_atual");
   // setTimeout(() => location.reload(), 1800);
  })
  .catch(err => {
    console.error('Erro enviarTudo:', err);
    showToast('Erro ao enviar (' + (err.message||'verifique o console') + '). Dados continuam salvos localmente.', 'erro');
    if(btnEnviar){ btnEnviar.disabled = false; btnEnviar.innerText = textoOriginal; }
  });
}

/* ===== TESTE DE CONEXÃO Power Automate ===== */
function testarConexaoPA(){
  let btn = document.getElementById('btnTestePA');
  let log = document.getElementById('logTestePA');
  btn.disabled = true;
  log.style.display = 'block';
  log.innerHTML = '⏳ Enviando payload de teste…';

  let email = getEmailUsuario();
  let payload = Object.assign({}, { __teste: true }, {
    __email: email,
    __data_envio: new Date().toISOString()
  });

  let inicio = Date.now();

  fetch(PA_CRIAR, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(r => {
    let ms = Date.now() - inicio;
    let status = r.status;
    return r.text().then(body => {
      let ok = r.ok;
      let linhas = [
        `<b>Status HTTP:</b> ${status} ${ok ? '✅' : '❌'}`,
        `<b>Tempo:</b> ${ms} ms`,
        `<b>Corpo da resposta:</b><br><code>${escapeHtml(body || '(vazio)')}</code>`,
      ];
      if(ok){
        linhas.push('<br>🟢 <b>Conexão OK!</b> O flow recebeu a requisição.');
        linhas.push('Verifique no Power Automate se a linha de teste foi criada.');
      } else {
        linhas.push('<br>🔴 <b>Falha.</b> Verifique a URL e as permissões do flow.');
      }
      log.innerHTML = linhas.join('<br>');
    });
  })
  .catch(err => {
    let ms = Date.now() - inicio;
    log.innerHTML = [
      `<b>Erro de rede / CORS:</b> ${escapeHtml(err.message)}`,
      `<b>Tempo:</b> ${ms} ms`,
      '<br>🔴 Possíveis causas:',
      '• A URL do flow está incorreta ou expirada',
      '• O flow não está habilitado',
      '• Bloqueio de CORS (o flow precisa retornar cabeçalhos CORS ou você precisa de um proxy)',
      '<br>Abra o Console do navegador (F12) para mais detalhes.',
    ].join('<br>');
  })
  .finally(() => { btn.disabled = false; });
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ===== TOAST ===== */
function showToast(msg, tipo){
  let t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.className = 'toast ' + (tipo === 'erro' ? 'toast-erro' : 'toast-ok');
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 4000);
}

/* ===== BLOQUEIO / DESBLOQUEIO DE SEÇÃO ===== */
function bloquearSecao(i){
  let section = document.querySelectorAll('.section')[i];
  section.querySelectorAll('input, textarea, select').forEach(el => el.disabled = true);

  // Adiciona botão Editar se ainda não existe
  if(!section.querySelector('.btn-editar')){
    let btnEditar = document.createElement('button');
    btnEditar.innerText = '✏️ Editar esta seção';
    btnEditar.className = 'btn-editar btn-gray';
    btnEditar.style.marginTop = '16px';
    btnEditar.onclick = () => desbloquearSecao(i, btnEditar);
    let nav = section.querySelector('.nav');
    if(nav) nav.prepend(btnEditar);
  }
}

function desbloquearSecao(i, btnEditar){
  let section = document.querySelectorAll('.section')[i];
  section.querySelectorAll('input, textarea, select').forEach(el => el.disabled = false);
  if(btnEditar) btnEditar.remove();
}

function restaurarBloqueios(){
  let enviadas = JSON.parse(localStorage.getItem('secoes_enviadas') || '{}');
  Object.keys(enviadas).forEach(i => bloquearSecao(Number(i)));
}

/* ===== HISTÓRICO ===== */
function abrirFormulario(){
  document.getElementById('formContainer').style.display = '';
  document.getElementById('historicoContainer').style.display = 'none';
  document.getElementById('enviarTudoWrap').style.display = '';
}

function abrirHistorico(){
  document.getElementById('formContainer').style.display = 'none';
  document.getElementById('enviarTudoWrap').style.display = 'none';

  let hc = document.getElementById('historicoContainer');
  hc.style.display = '';

  // ✅ pega só do localStorage
  let dadosLocal = JSON.parse(localStorage.getItem('form_correcao') || '{}');

  if(Object.keys(dadosLocal).length === 0){
    hc.innerHTML = '<p style="color:#546E7A;padding:20px">Nenhum registro salvo localmente.</p>';
    return;
  }

  renderHistorico([{
    id: 'local',
    email: getEmailUsuario(),
    Nome:getNomeUsuario(),
    data_envio: 'Salvo localmente',
    dados: dadosLocal
  }], hc);
}


function renderHistorico(registros, container){
  container.innerHTML = '';

  let titulo = document.createElement('h2');
  titulo.innerText = '📋 Histórico de Envios';
  titulo.style.cssText = 'color:#1C799B;margin-bottom:20px;';
  container.appendChild(titulo);

  if(!registros || registros.length === 0){
    container.innerHTML += '<p style="color:#546E7A">Nenhum registro encontrado.</p>';
    return;
  }

  registros.forEach(reg => {
    let card = document.createElement('div');
    card.style.cssText = `
      background:#fff;border-radius:10px;padding:18px 20px;margin-bottom:14px;
      box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;
      border-left:4px solid #1C799B;display:flex;justify-content:space-between;align-items:center;
    `;

    let data = new Date(reg.data_envio);
    let dataStr = isNaN(data) ? reg.data_envio : data.toLocaleString('pt-BR');

    card.innerHTML = `
      <div>
        <div style="font-weight:700;color:#263238;font-size:15px">Envio — ${dataStr}</div>
        <div style="color:#546E7A;font-size:13px;margin-top:4px">ID: ${reg.id}</div>
      </div>
      <button class="btn-primary" style="padding:8px 16px;font-size:13px">Abrir</button>
    `;

    card.querySelector('button').onclick = () => abrirRegistro(reg);
    container.appendChild(card);
  });
}

function abrirRegistro(reg){
  // Salva o ID do registro carregado
  localStorage.setItem('registro_id_atual', reg.id);

  // Carrega os dados nos campos
  let dados = reg.dados || {};
  Object.keys(dados).forEach(k => {
    let el = document.getElementById(k) || document.querySelector(`input[name="${k}"][value="${dados[k]}"]`);
    if(el){
      if(el.type === 'radio'){
        let r = document.querySelector(`input[name="${k}"][value="${dados[k]}"]`);
        if(r) r.checked = true;
      } else {
        el.value = dados[k];
      }
    }
  });

  // Bloqueia todas as seções (já enviadas)
  form.secoes.forEach((_,i) => bloquearSecao(i));

  // Abre o formulário na primeira seção
  abrirFormulario();
  mostrar(0);
}

/* INIT */
criarMenu();
criarForm();
carregar();
restaurarBloqueios();

</script>
