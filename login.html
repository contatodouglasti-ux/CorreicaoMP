<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login Microsoft</title>
  <script src="https://alcdn.msauth.net/browser/2.37.0/js/msal-browser.min.js"></script>
  <style>
    :root{--bg:#f4f6f7;--card:#fff;--accent:#1C799B;--text:#263238;--muted:#546E7A}
    html,body{height:100%;margin:0;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:520px;background:var(--card);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,0.09);padding:32px}
    h1{margin:0 0 10px;font-size:26px;color:var(--accent)}
    p{margin:0 0 24px;color:var(--muted);line-height:1.6}
    label{font-size:14px;color:var(--muted);display:block;margin-bottom:8px}
    input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #d7e3eb;font-size:15px;color:var(--text);outline:none}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(28,121,155,0.12)}
    .buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    button{flex:1 1 140px;border:none;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-secondary{background:#eef7f8;color:var(--accent)}
    .debug{margin-top:20px;background:#f7f9f9;border-radius:10px;padding:14px;min-height:120px;overflow:auto;font-family:monospace;font-size:13px;color:#102027;white-space:pre-wrap}
    .footer{margin-top:16px;font-size:13px;color:var(--muted);text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>MPAM CGMP</h1><h2>Login Microsoft</h2>
      <p>Entre com sua conta Microsoft para acessar a aplicação.</p>
      <label for="emailInput">E-mail</label>
      <input id="emailInput" type="email" placeholder="seu@exemplo.com" autocomplete="username" />
      <p style="margin-top:8px;font-size:13px;color:#546E7A">A senha será solicitada diretamente na página segura da Microsoft.</p>
      <div class="buttons">
        <button id="btnLogin" class="btn-primary">Entrar</button>
      </div>
      <div class="debug" id="debug">Digite seu e-mail e clique em Entrar.</div>
      <div class="footer">Após o login você será redirecionado para a página principal.</div>
    </div>
  </div>
  <script>
    const debugEl = document.getElementById('debug');
    const emailInput = document.getElementById('emailInput');
    const btnLogin = document.getElementById('btnLogin');

    // Defina aqui o Client ID, tenant e redirect URI exatos da sua aplicação Azure AD.
    const CLIENT_ID = 'db712dfb-57de-488e-af9f-12bee87fa61c';
    const TENANT = '84a9248e-396f-44df-84a9-4379e11007ab';
    const REDIRECT_URI = 'https://correicao-mp.vercel.app/login.html';

    function log(...args){
      debugEl.textContent = args.map(a=>typeof a==='object'?JSON.stringify(a,null,2):String(a)).join(' ');
      console.log(...args);
    }

    const savedEmail = localStorage.getItem('msal_email');
    if(savedEmail) emailInput.value = savedEmail;

    function getConfig(){
      const email = (emailInput.value || '').trim();
      return { clientId: CLIENT_ID, tenant: TENANT, email, redirectUri: REDIRECT_URI };
    }

    function initMsal(cfg){
      if(!cfg) return null;
      try{
        const authority = cfg.tenant
          ? `https://login.microsoftonline.com/${encodeURIComponent(cfg.tenant)}`
          : 'https://login.microsoftonline.com/common';
        const msalConfig = { auth: { clientId: cfg.clientId, authority, redirectUri: cfg.redirectUri } };
        return new msal.PublicClientApplication(msalConfig);
      }catch(e){
        log('Erro ao inicializar MSAL:', e);
        return null;
      }
    }

    btnLogin.addEventListener('click', ()=>{
      const cfg = getConfig();
      if(!cfg.clientId || cfg.clientId.includes('COLOQUE_SEU_CLIENT_ID_AQUI')){
        log('O aplicativo não está configurado. Edite login.html e defina o Client ID.');
        return;
      }
      localStorage.setItem('msal_email', cfg.email || '');
      const msalInstance = initMsal(cfg);
      if(!msalInstance) return;
      log(`Iniciando loginRedirect com redirectUri: ${cfg.redirectUri}`);
      msalInstance.loginRedirect({ scopes: ['user.read'], loginHint: cfg.email || undefined });
    });

    (function autoInit(){
      const cfg = getConfig();
      if(cfg){
        const msalInstance = initMsal(cfg);
        if(msalInstance){
          log('MSAL inicializado. Aguardando login...');
          msalInstance.handleRedirectPromise().then(response=>{
            if(response && response.account){
              log('Login concluído:', response.account.username);
              sessionStorage.setItem('msalAccount', JSON.stringify(response.account));
              window.location.href = 'index.html';
            }
          }).catch(err=> log('Erro ao tratar redirect:', err.errorMessage || err.message || err));
        }
      } else {
        log('Digite seu e-mail e clique em Entrar.');
      }
    })();
  </script>
</body>
</html>
