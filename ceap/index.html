<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Procedimentos de Controle Externo da Atividade Policial</title>
<style>:root{--azul:#124b5f;--azul2:#1c799b;--bg:#eef5f7;--erro:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#17333d}.topo{background:var(--azul);color:#fff;padding:19px 24px;font-weight:bold}.corpo{max-width:900px;margin:32px auto;padding:0 18px}.cab{margin-bottom:20px}.cab h1{margin:0;color:var(--azul);font-size:30px}.cab p{color:#55717b;line-height:1.5}.cartao{background:#fff;border:1px solid #d4e2e7;border-radius:16px;padding:28px;box-shadow:0 10px 24px #124b5f12}h2{font-size:19px;color:var(--azul);border-bottom:1px solid #dce8ec;padding-bottom:11px;margin-top:28px}.campo{margin:18px 0}.campo label{display:block;font-weight:bold;font-size:14px;margin-bottom:7px}.campo input,.campo select{width:100%;padding:12px;border:1px solid #adc8d2;border-radius:9px;font:inherit}.campo.erro input,.campo.erro select{border-color:var(--erro);background:#fff7f6}.mensagem{color:var(--erro);font-size:12px;font-weight:bold;margin-top:5px}.duas{display:grid;grid-template-columns:1fr 1fr;gap:15px}.enviar{margin-top:28px;width:100%;border:0;border-radius:9px;padding:14px;background:var(--azul2);color:#fff;font-size:15px;font-weight:bold;cursor:pointer}.enviar:disabled{opacity:.6;cursor:wait}.ok{background:#e7f6ee;color:#166534;padding:14px;border-radius:9px;font-weight:bold;display:none}@media(max-width:600px){.duas{grid-template-columns:1fr}.cartao{padding:20px}}</style></head>
<body><header class="topo">MPAM · CGMP</header><main class="corpo"><section class="cab"><h1>Procedimentos de Controle Externo da Atividade Policial</h1><p>Levantamento CEAP — coleta de dados dos últimos 3 meses.</p></section><div id="sucesso" class="ok">Dados enviados com sucesso.</div><form id="form" class="cartao" novalidate>
<h2>Identificação</h2><div class="campo"><label for="promotoria">Promotoria de Justiça *</label><select id="promotoria" required><option value="">Carregando opções…</option></select></div><div class="campo"><label for="membro">Nome do membro responsável pelo preenchimento *</label><input id="membro" required></div><div class="duas"><div class="campo"><label for="inicio">Período de referência — início *</label><input id="inicio" type="date" required></div><div class="campo"><label for="fim">Período de referência — fim *</label><input id="fim" type="date" required></div></div>
<h2>Dados quantitativos</h2><div class="campo"><label for="total">Total de procedimentos no período *</label><input id="total" type="number" min="0" required></div><h2>Procedimentos encaminhados</h2><div class="campo"><label for="uaip">Encaminhados à UAIP *</label><input id="uaip" type="number" min="0" required></div><div class="campo"><label for="djd">Encaminhados à DJD *</label><input id="djd" type="number" min="0" required></div><h2>Arquivados pelos órgãos apuradores</h2><div class="campo"><label for="arqUaip">Arquivados pela UAIP *</label><input id="arqUaip" type="number" min="0" required></div><div class="campo"><label for="arqDjd">Arquivados pela DJD *</label><input id="arqDjd" type="number" min="0" required></div><h2>Retornaram à Promotoria</h2><div class="campo"><label for="retUaip">Retornaram da UAIP *</label><input id="retUaip" type="number" min="0" required></div><div class="campo"><label for="retDjd">Retornaram da DJD *</label><input id="retDjd" type="number" min="0" required></div><button class="enviar" type="submit">Enviar levantamento</button></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script>
const db=supabase.createClient(CONFIG.supabase.url,CONFIG.supabase.anonKey);
const form=document.getElementById('form'), campo=id=>document.getElementById(id);
async function carregarPromotorias(){const{data,error}=await db.rpc('listar_promotorias_ceap');const select=campo('promotoria');if(error){select.innerHTML='<option value="">Não foi possível carregar as opções</option>';return}select.innerHTML='<option value="">Selecione</option>'+data.map(x=>'<option value="'+x.nome.replace(/"/g,'&quot;')+'">'+x.nome+'</option>').join('')}
function validar(){let valido=true;form.querySelectorAll('.campo').forEach(x=>{x.classList.remove('erro');x.querySelector('.mensagem')?.remove()});form.querySelectorAll('[required]').forEach(x=>{if(!x.value||x.validity.rangeUnderflow){const p=x.closest('.campo');p.classList.add('erro');p.insertAdjacentHTML('beforeend','<div class="mensagem">Campo obrigatório.</div>');valido=false}});if(campo('fim').value&&campo('inicio').value&&campo('fim').value<campo('inicio').value){const p=campo('fim').closest('.campo');p.classList.add('erro');p.insertAdjacentHTML('beforeend','<div class="mensagem">O fim deve ser posterior ao início.</div>');valido=false}return valido}
form.addEventListener('submit',async e=>{e.preventDefault();if(!validar())return;const botao=form.querySelector('button');botao.disabled=true;try{const{error}=await db.from('levantamentos_ceap').insert({promotoria_justica:campo('promotoria').value,membro_responsavel:campo('membro').value.trim(),periodo_inicio:campo('inicio').value,periodo_fim:campo('fim').value,total_procedimentos:+campo('total').value,encaminhados_uaip:+campo('uaip').value,encaminhados_djd:+campo('djd').value,arquivados_uaip:+campo('arqUaip').value,arquivados_djd:+campo('arqDjd').value,retornaram_uaip:+campo('retUaip').value,retornaram_djd:+campo('retDjd').value});if(error)throw error;form.reset();form.style.display='none';document.getElementById('sucesso').style.display='block'}catch(err){alert('Não foi possível enviar. Tente novamente.')}finally{botao.disabled=false}});carregarPromotorias();
</script></body></html>
